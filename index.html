<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Каталог уходовой косметики для лица</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,100..900;1,100..900&display=swap"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"
    />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <header class="header">
      <div class="header__container container">
        <div class="header__left">
          <button class="header__burger-btn" type="button" aria-label="Меню">
            <i class="fa-solid fa-bars"></i>
          </button>

          <a href="#" class="header__logo">
            <img
              src="images/logo.png"
              alt="Логотип"
              class="header__logo-image"
            />
            <span class="header__logo-title">SkinCare</span>
          </a>
        </div>

        <nav class="header__nav nav">
          <ul class="nav__list clear-list">
            <li class="nav__item"><a href="#" class="nav__link">Главная</a></li>
            <li class="nav__item"><a href="#" class="nav__link">Каталог</a></li>
            <li class="nav__item"><a href="#" class="nav__link">О нас</a></li>
            <li class="nav__item">
              <a href="#" class="nav__link">Контакты</a>
            </li>
          </ul>
        </nav>

        <button class="header__cart-btn" type="button" aria-label="Корзина">
          <i class="fa-solid fa-cart-shopping"></i>
        </button>
      </div>
    </header>

    <main class="catalog">
      <div class="container catalog__container">
        <h1 class="title catalog__title">Выбери свой продукт</h1>

        <div>
          <button id="change-first-card-btn" type="button">
            Цвет первой карточки
          </button>
          <button id="change-all-cards-btn" type="button">
            Цвет всех карточек
          </button>
          <button id="open-google-btn" type="button">Открыть Google</button>
          <button id="show-alert-btn" type="button">Консоль и Alert</button>
          <button id="toggle-color-btn" class="color-toggle-btn" type="button">
            Переключить цвет кнопки
          </button>
          <button id="open-modal-btn" type="button">Регистрация</button>

          <ul id="products-list" class="products clear-list"></ul>

          <footer class="footer">
            <div class="footer__container container">

              <div class="footer__social">
                <h2 class="footer__social-title">Product Cards</h2>
                <p class="footer__text">У нас самые лучшие продукты для кожи!</p>
                <div class="footer__social-icons">
                  <a href="#"><img 
                    src="images/telegram-icon.png" alt="телеграм"></a>
                  <a href="#"><img src="images/vk-icon.png" alt="вКонтакте"></a>
                </div>
              </div>

              <div class="footer__subscribe">
                <p class="footer__subscribe-title">Подпишись на наши акции:</p>
                <form class="footer__subscribe-form">
                <input type="email" id="email-input" placeholder="Введи email..." required />
                <button type="submit">Подписаться</button>
                </form>
              </div>

              <div class="footer__links">
                <h3 class="footer__links-title">Быстрые ссылки</h3>
                <nav class="footer__nav">
                  <ul class="footer__nav-ul">
                    <li><a href="#">Главная</a></li>
                    <li><a href="#">Магазин</a></li>
                    <li><a href="#">Контакты</a></li>
                  </ul>
                </nav>
              </div>
            </div>
            <div class="footer__copyright">
              <p class="footer__bottom">www.product-cards.com©all right reserve</p>
            </div>
          </footer>



          <template id="products-template">
            <li class="products__item card">
              <img src="" alt="" class="product-image card__image" />
              <span class="product-category card__category"></span>
              <h2 class="product-name card__name"></h2>
              <p class="product-description card__description"></p>
              <div class="card__compound compound">
                <span class="compound__name">Состав:</span>
                <ul class="product-compound"></ul>
              </div>
              <div class="card__price">
                <b>Цена</b>
                <span class="product-price"></span>
              </div>
            </li>
          </template>

          <div class="overlay" id="overlay"></div>
          <div class="modal" id="modal">
            <button class="modal__close-btn" type="button">&times;</button>
            <form class="modal__form">
              <label for="username">Имя:</label>
              <input type="text" id="username" name="username" placeholder="Введите имя" required />
              <label for="userSurname">Фамилия:</label>
              <input type="text" id="userSurname" name="userSurname" placeholder="Введите фамилию" required />
              <label for="userDateOfBirth">Дата рождения:</label>
              <input type="date" id="userDateOfBirth" name="userDateOfBirth" placeholder="Выберите дату рождения" required />
              <label for="userLogin">Email:</label>
              <input type="email" id="userLogin" name="userLogin" placeholder="Введите логин" minlength="5" required />
              <label for="userPassword">Пароль:</label>
              <input type="password" id="userPassword" name="userPassword" placeholder="Введите пароль" minlength="5" required />
              <label for="userConfirmPassword">Подтвердите пароль:</label>
              <input type="password" id="userConfirmPassword" name="userConfirmPassword" placeholder="Подтвердите пароль" required />
              <button type="submit">Зарегистрироваться</button>
            </form>
          </div>



        <script src="main.js"></script>
        <script src="homework-7.js"></script>
        <script src="homework-8.js"></script>
        <script type="module" src="homework-9.js"></script>
        <script type="module" src="homework-10.js"></script>
        <script type="module" src="homework-11.js"></script>
      </div>
    </main>
  </body>
</html>
